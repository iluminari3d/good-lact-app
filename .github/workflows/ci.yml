name: CI

on:
  push:
    branches: [main, 'staging/**', 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: good-lact-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: good-lact-project/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # "build" esegue già il controllo dei tipi (tsc -b) prima di vite build
      - name: Build (controllo tipi + vite)
        run: npm run build
